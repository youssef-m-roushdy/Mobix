services:
  postgres:
    image: postgres:16-alpine
    container_name: phone-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phone_store_db
    ports:
      - "5434:5432"
    volumes:
      - phone_store_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  phone_store_data:
    driver: local